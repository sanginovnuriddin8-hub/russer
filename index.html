<title>Russer — орехи, сухофрукты и финики оптом и в розницу</title>
<meta name="description" content="Russer — премиальные орехи, сухофрукты, финики и восточные сладости. Крупный и мелкий опт, розница. Наши соцсети и контакты.">
<meta property="og:title" content="Russer — орехи, сухофрукты, финики">
<meta property="og:description" content="Крупный и мелкий опт, а также розница. Наши соцсети и связь с нами.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:      #3F5219;
    --green-lit:  #5F6C2E;
    --green-deep: #26350F;
    --gold:       #B8912F;
    --gold-lit:   #D8B45C;
    --gold-deep:  #8C6C22;
    --ivory:      #F5EFDF;
    --ink:        #2A3313;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    min-height:100dvh; display:flex; justify-content:center; align-items:flex-start;
    padding:clamp(26px,6vw,56px) 18px;
    background:#FFFFFF;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    position:relative; width:100%; max-width:432px; text-align:center;
    padding:clamp(30px,7vw,44px) clamp(20px,5vw,30px) 34px;
    border-radius:26px; background:#FFFFFF;
    border:1px solid rgba(184,145,47,.4);
    box-shadow:0 24px 60px -34px rgba(63,82,25,.45);
  }
  .card::before{
    content:""; position:absolute; inset:12px; border-radius:18px;
    border:1px solid rgba(184,145,47,.32); pointer-events:none;
  }
  .corner{ position:absolute; width:22px; height:22px; border:1.5px solid var(--gold); opacity:.85; }
  .corner.tl{ top:20px; left:20px; border-right:none; border-bottom:none; }
  .corner.tr{ top:20px; right:20px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:20px; left:20px; border-right:none; border-top:none; }
  .corner.br{ bottom:20px; right:20px; border-left:none; border-top:none; }

  .avatar{
    width:118px; height:118px; margin:0 auto 22px; position:relative;
    border-radius:50%; padding:4px;
    background:linear-gradient(140deg,var(--gold-lit),var(--gold-deep));
    box-shadow:0 14px 30px -14px rgba(63,82,25,.5);
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  .avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
    border:2px solid #FFFFFF; }

  .brand{
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:700;
    font-size:clamp(44px,14vw,62px); line-height:1; letter-spacing:.14em; text-indent:.14em;
    color:var(--green);
    animation:rise .9s cubic-bezier(.2,.7,.2,1) .05s both;
  }
  .eyebrow{
    margin-top:14px; display:flex; align-items:center; justify-content:center; gap:11px;
    font-size:10.5px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold-deep);
    animation:rise .9s ease .1s both;
  }
  .eyebrow::before,.eyebrow::after{ content:""; height:1px; width:26px;
    background:linear-gradient(90deg,transparent,var(--gold)); }
  .eyebrow::after{ transform:scaleX(-1); }
  .tagline{
    margin:13px auto 0; max-width:310px; font-weight:300; font-size:14px; line-height:1.6;
    color:#4B5730; animation:rise .9s ease .16s both;
  }
  .tagline b{ font-weight:600; color:var(--green); }

  .links{ margin-top:30px; display:flex; flex-direction:column; gap:13px; }
  .link{
    --i:0; position:relative; display:flex; align-items:center; gap:15px;
    padding:15px 18px; border-radius:14px; text-decoration:none; color:var(--ivory);
    background:linear-gradient(135deg,var(--green-lit) 0%,var(--green-deep) 100%);
    border:1px solid rgba(184,145,47,.55); overflow:hidden;
    box-shadow:0 10px 22px -14px rgba(63,82,25,.65);
    transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) calc(.22s + var(--i)*.06s) both;
  }
  .link::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(120deg,transparent 32%,rgba(216,180,92,.28) 50%,transparent 68%);
    transform:translateX(-120%); transition:transform .6s ease; }
  .link:hover,.link:focus-visible{ transform:translateY(-3px); border-color:var(--gold-lit);
    box-shadow:0 18px 30px -14px rgba(63,82,25,.7); outline:none; }
  .link:hover::after,.link:focus-visible::after{ transform:translateX(120%); }
  .link:active{ transform:translateY(-1px); }

  .ic{ flex:0 0 40px; width:40px; height:40px; display:grid; place-items:center;
    background:rgba(245,239,223,.12); border:1px solid rgba(216,180,92,.4); border-radius:11px; }
  .ic svg{ width:21px; height:21px; fill:var(--gold-lit); }

  .txt{ text-align:left; flex:1 1 auto; min-width:0; }
  .txt .t{ display:block; font-size:15px; font-weight:500; line-height:1.2; }
  .txt .s{ display:block; margin-top:4px; font-size:11px; font-weight:400;
    letter-spacing:.14em; text-transform:uppercase; color:rgba(216,180,92,.9); line-height:1.2; }

  .chev{ flex:0 0 auto; opacity:.65; transition:transform .35s,opacity .35s; }
  .chev svg{ width:14px; height:14px; stroke:var(--gold-lit); fill:none; stroke-width:2; }
  .link:hover .chev,.link:focus-visible .chev{ transform:translateX(4px); opacity:1; }

  .link.call{ background:linear-gradient(135deg,var(--gold) 0%,var(--gold-deep) 100%);
    border-color:var(--green); }
  .link.call .ic{ background:rgba(38,53,15,.18); border-color:rgba(38,53,15,.3); }
  .link.call .ic svg{ fill:var(--ivory); }
  .link.call .txt .s{ color:rgba(245,239,223,.9); }
  .link.call .chev svg{ stroke:var(--ivory); }

  footer{ margin-top:28px; font-size:10.5px; letter-spacing:.24em; text-transform:uppercase;
    color:#8F8A6E; animation:rise .9s ease .6s both; }
  footer .dot{ color:var(--gold); }
  @keyframes rise{ from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>
